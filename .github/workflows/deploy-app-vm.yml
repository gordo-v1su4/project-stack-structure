name: Deploy to App VM
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: project-stack-structure-production-app-vm
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, stack-structure-production]
    environment: production-app-vm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build, verify, and activate exact main through Dockhand
        run: node scripts/deploy-app-vm.mjs "$GITHUB_SHA"
