name: project-stack-structure
services:
  app:
    image: project-stack-structure-web:bootstrap
    pull_policy: never
    container_name: project-stack-structure-web
    restart: unless-stopped
    ports:
      - 127.0.0.1:18102:3000
    cpus: 2
    mem_limit: 2g
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      AUTH_GITHUB_ID: ${AUTH_GITHUB_ID}
      AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST}
      AUTH_URL: ${AUTH_URL}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY}
      ESSENTIA_API_KEY: ${ESSENTIA_API_KEY}
      ESSENTIA_API_URL: ${ESSENTIA_API_URL}
      FFMPEG_GATEWAY_API_KEY: ${FFMPEG_GATEWAY_API_KEY}
      FFMPEG_GATEWAY_URL: ${FFMPEG_GATEWAY_URL}
      HIGGSFIELD_ALLOWED_IMAGE_HOSTS: ${HIGGSFIELD_ALLOWED_IMAGE_HOSTS}
      HIGGSFIELD_CREDENTIALS_JSON: ${HIGGSFIELD_CREDENTIALS_JSON}
      HIGGSFIELD_WORKSPACE_ID: ${HIGGSFIELD_WORKSPACE_ID}
      IMAGE_SPLITTER_ACCESS_CODE: ${IMAGE_SPLITTER_ACCESS_CODE}
      MEDIA_API_TOKEN: ${MEDIA_API_TOKEN}
      MEDIA_GATEWAY_BUCKET: ${MEDIA_GATEWAY_BUCKET}
      MEDIA_GATEWAY_TOKEN: ${MEDIA_GATEWAY_TOKEN}
      MEDIA_GATEWAY_UPLOAD_PREFIX: ${MEDIA_GATEWAY_UPLOAD_PREFIX}
      MEDIA_GATEWAY_URL: ${MEDIA_GATEWAY_URL}
      MEDIA_GATEWAY_USER_ID: ${MEDIA_GATEWAY_USER_ID}
      QWEN_CAPTION_GATEWAY_TOKEN: ${QWEN_CAPTION_GATEWAY_TOKEN}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_S3_ENDPOINT: ${RUSTFS_S3_ENDPOINT}
      RUSTFS_S3_ORIGIN_ADDRESS: ${RUSTFS_S3_ORIGIN_ADDRESS:-}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      SCENE_CAPTION_SMART_GATEWAY_TOKEN: ${SCENE_CAPTION_SMART_GATEWAY_TOKEN}
      SCENE_CAPTION_SMART_GATEWAY_URL: ${SCENE_CAPTION_SMART_GATEWAY_URL}
      SWARMUI_URL: ${SWARMUI_URL}
      TRIGGER_API_URL: ${TRIGGER_API_URL}
      TRIGGER_PROJECT_REF: ${TRIGGER_PROJECT_REF}
      TRIGGER_SECRET_KEY: ${TRIGGER_SECRET_KEY}
    labels:
      dockhand.update: "false"
      dockhand.url: https://stack.v1su4.dev
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
